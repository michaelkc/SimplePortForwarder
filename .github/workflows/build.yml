name: Build & Test

on:
  push:
    branches: [main, dotnet10-upgrade]
    tags: ['v*']
  pull_request:
    branches: [main, dotnet10-upgrade]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore portforwarder.sln

      - name: Build
        run: dotnet build portforwarder.sln --no-restore -c Release

      - name: Test
        run: dotnet test portforwarder.sln --no-build -c Release --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'

      - name: Publish self-contained
        run: dotnet publish src/portforwarder.csproj -c Release -r win-x64 --self-contained -o publish

      - name: Build MSI installer
        run: dotnet build installer/PortForwarder.Installer.wixproj -p:PublishDir=${{ github.workspace }}\publish\

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortForwarder-win-x64-msi
          path: installer/bin/Debug/PortForwarder.Installer.msi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/bin/Debug/PortForwarder.Installer.msi
